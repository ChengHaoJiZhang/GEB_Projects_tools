<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Smart Open</title>
<style>
  html,body{margin:0;width:100%;height:100%;background:#191919;color:#ddd;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
  body{display:flex;align-items:center;justify-content:center}
  #msg{font-size:13px;opacity:.7}
</style>
</head>
<body>
<div id="msg">Opening…</div>
<script>
(function(){
  const APPS = {
    spotify: {
      ios: "https://openinapp.link/w93c0",
      native: "spotify:",
      web: "https://open.spotify.com/"
    }
  };

  function isIOSorIPadOS(){
    const ua = navigator.userAgent || "";
    return /iPhone|iPad|iPod/i.test(ua) ||
      (/Macintosh/i.test(ua) && /Mobile/i.test(ua)) ||
      (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
  }

  const key = new URLSearchParams(location.search).get("app");
  const cfg = APPS[key];

  if (!cfg) {
    document.getElementById("msg").textContent = "Unknown app";
    return;
  }

  if (isIOSorIPadOS()) {
    location.replace(cfg.ios);
    return;
  }

  let appOpened = false;
  let timer;

  function markOpened(){
    appOpened = true;
    if (timer) clearTimeout(timer);
  }

  document.addEventListener("visibilitychange", function(){
    if (document.hidden) markOpened();
  });
  window.addEventListener("pagehide", markOpened);
  window.addEventListener("blur", function(){
    setTimeout(function(){
      if (document.hidden) markOpened();
    }, 100);
  });

  location.href = cfg.native;

  timer = setTimeout(function(){
    if (!appOpened && !document.hidden) location.replace(cfg.web);
  }, 1800);
})();
</script>
</body>
</html>
